<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TR AI Images</title>
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('assets/img/gradientai3.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      margin:auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      padding: 40px;
      max-width: 420px;
      width: 80%;
      text-align: center;
      color: #ffffff;
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
      font-size: 26px;
      color: #ffffffee;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    textarea {
      resize: none;
      background-color: rgba(121, 121, 121, 0.15);
      color: rgb(255, 255, 255);
      width: 92%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    #loading {
      margin: 25px auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: pulse 1s infinite ease-in-out;
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    #resultImage {
      margin-top: 25px;
      border-radius: 18px;
      width: 100%;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    #downloadBtn {
      margin-top: 15px;
      background: linear-gradient(to right, #9c5bd4, #6842e3);
      display: none;
    }

    #inpaintBtn {
      margin-top: 15px;
      background: linear-gradient(to right, #ffaa00, #ff6600);
    }
  </style>
</head>
<body>
  <div id="main-ui" class="container" style="display:none;">
    <h2>💎 AI Image Generator</h2>
    <textarea id="prompt" rows="3" placeholder="Scrie un prompt (english only)."></textarea>
    <button onclick="sendPrompt()">Generează imaginea</button>
    <button id="inpaintBtn" onclick="window.location.href='assets/inpaint.html'">Comută la Modul Inpaint (beta)</button>
    <div id="loading"></div>
    <img id="resultImage" />
    <button id="downloadBtn" onclick="downloadImage()">Descarcă Imaginea</button>
  </div>

 
  <div id="offline-ui" class="container" style="display:none; text-align:center;">
  <h1 style="color: #ffffff; font-size: 2em;">❌ Serverul AI este oprit</h1>
  <p style="color: #ffffff;">Încearcă din nou mai târziu.</p>
</div>

  <script>
    async function checkServerStatus() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 1500);

  try {
    const res = await fetch("/ping", {
      method: "GET",
      signal: controller.signal
    });
    clearTimeout(timeout);

    const text = await res.text();
    if (!text.toLowerCase().includes("pong")) throw new Error("Invalid ping");

    document.getElementById("main-ui").style.display = "block";
  } catch (e) {
    document.getElementById("offline-ui").style.display = "block";
  }
}    

    checkServerStatus();  

    async function sendPrompt() {
      const prompt = document.getElementById("prompt").value.trim();
      if (!prompt) {
        alert("Scrie un prompt!");
        return;
      }

      document.getElementById("loading").style.display = "block";
      document.getElementById("resultImage").style.display = "none";
      document.getElementById("downloadBtn").style.display = "none";

      try {
        const response = await fetch("/v1/generation/text-to-image", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: prompt,
	    negative_prompt: "unrealistic, saturated, high contrast, big nose, painting, drawing, sketch, cartoon, anime, manga, render, CG, 3d, watermark, signature, label, facial imperfections, deformed face",
	    base_model_name: "realisticStockPhoto_v20.safetensors",
            performance_selection: "Lightning",
	    guidance_scale: 5.5,
            aspect_ratios_selection: "1024*1024",
            async_process: false,
	    loras: [
     		 {
			lora:"SDXL_FILM_PHOTOGRAPHY_STYLE_V1.safetensors", 
			weight: 0.5,
			model_name: "SDXL",
    			enabled: true
		}
    		]
          })
        });

        if (!response.ok) throw new Error("Eroare de la server.");
        const data = await response.json();
	console.log("[RESPONSE]", data);


        let imageUrl = Array.isArray(data) && data[0]?.url;
	if (imageUrl?.startsWith("http://192.168.")) {
  	const relativePath = imageUrl.split("/files/")[1];
  	imageUrl = "/files/" + relativePath;
	}

	if (!imageUrl) throw new Error("Nu s-a generat nicio imagine.");


        const resultImage = document.getElementById("resultImage");
        resultImage.src = imageUrl;
        resultImage.style.display = "block";

        const downloadBtn = document.getElementById("downloadBtn");
        downloadBtn.onclick = function () {
          const link = document.createElement("a");
          link.href = imageUrl;
          link.download = "imagine_generata.png";
          link.click();
        };
        downloadBtn.style.display = "inline-block";

      } catch (err) {
        alert(err.message);
        console.error(err);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function downloadImage() {
      const image = document.getElementById("resultImage");
      const link = document.createElement("a");
      link.href = image.src;
      link.download = "imagine_generata.png";
      link.click();
    }
  </script>
</body>
</html>
