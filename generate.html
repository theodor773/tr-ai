<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TR AI Images</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('img/gradientai3.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      padding: 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      color: #ffffff;
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
      font-size: 26px;
      color: #ffffffee;
    }

    textarea, button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      resize: none;
      background-color: rgba(121, 121, 121, 0.15);
      color: rgb(255, 255, 255);
    }

    button {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    #loading {
      margin: 25px auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: pulse 1s infinite ease-in-out;
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    #resultImage {
      margin-top: 25px;
      border-radius: 18px;
      width: 100%;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    #downloadBtn {
      margin-top: 15px;
      background: linear-gradient(to right, #9c5bd4, #6842e3);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="mainUI">
    <h2>💎 AI Image Generator</h2>
    <textarea id="prompt" rows="3" placeholder="Scrie un prompt (english only)."></textarea>
    <button onclick="sendPrompt()">Generează imaginea</button>
    <div id="queueInfo" style="margin-top:10px; color:white; display:none;"></div>
    <div id="loading"></div>
    <img id="resultImage" />
    <button id="downloadBtn" onclick="downloadImage()">Descarcă Imaginea</button>
  </div>

  <script>
    async function checkServerStatus() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 1000);

      try {
        const res = await fetch("/ping", {
          method: "GET",
          signal: controller.signal
        });
        clearTimeout(timeout);
        const txt = await res.text();
        if (!(res.ok && txt.trim() === "pong")) throw new Error();
      } catch (e) {
        const container = document.getElementById("mainUI");
        container.innerHTML = `
          <h2>❌ Serverul AI este oprit</h2>
          <p style="font-size: 18px;">Încearcă din nou mai târziu.</p>
        `;
      }
    }

    checkServerStatus();

async function sendPrompt() {
  const prompt = document.getElementById("prompt").value.trim();
  if (!prompt) {
    alert("Scrie un prompt!");
    return;
  }

  const formData = new FormData();
  formData.append("prompt", prompt);

  document.getElementById("loading").style.display = "block";
  document.getElementById("resultImage").style.display = "none";
  document.getElementById("downloadBtn").style.display = "none";

  try {
    const response = await fetch("/generate", {
      method: "POST",
      body: formData,
    });

    if (!response.ok) throw new Error("Eroare de la server.");
    const data = await response.json();

const imageUrl = data.url;
const timestamp = data.timestamp;
if (!imageUrl || !timestamp) throw new Error("Imaginea nu a fost generată corect.");

let attempts = 0;
const maxAttempts = 100;

// 1. Așteaptă până când statusul e `ready: true`
while (attempts < maxAttempts) {
  try {
    const statusRes = await fetch(`/status/${timestamp}`);
    const statusData = await statusRes.json();

    if (statusData.ready === true) {
      console.log("✅ Imaginea este confirmată ca fiind gata de server.");
      break; // ieșim din while
    }
  } catch (error) {
    console.warn(`⚠️ Eroare la verificare status:`, error);
  }

  attempts++;
  await new Promise(resolve => setTimeout(resolve, 3000)); // verificare la 3 sec
}

if (attempts === maxAttempts) {
  throw new Error("Imaginea nu a fost generată la timp.");
}

    // GET efectiv la imagine + o punem în <img>
    const finalUrl = imageUrl + "?t=" + Date.now(); // cache-busting
    const imgRes = await fetch(finalUrl, { cache: "no-cache" });
    if (!imgRes.ok) throw new Error("Eroare la descărcarea imaginii.");

    const blob = await imgRes.blob();
    const imageURL = URL.createObjectURL(blob);

    const resultImage = document.getElementById("resultImage");
    resultImage.src = imageURL;
    resultImage.style.display = "block";

    const downloadBtn = document.getElementById("downloadBtn");
    downloadBtn.onclick = function () {
      const link = document.createElement("a");
      link.href = imageURL;
      link.download = "imagine_generata.png";
      link.click();
    };
    downloadBtn.style.display = "inline-block";

  } catch (err) {
    alert(err.message);
    console.error(err);
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}



    function downloadImage() {
      const image = document.getElementById("resultImage");
      const link = document.createElement("a");
      link.href = image.src;
      link.download = "imagine_generata.png";
      link.click();
    }
  </script>
</body>
</html>
